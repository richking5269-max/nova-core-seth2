<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA CORE 賽特 II&#65372;AI 實戰分析終端</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function(){
      document.addEventListener("contextmenu",function(e){e.preventDefault();});
      document.addEventListener("keydown",function(e){
        var k=(e.key||"").toUpperCase();
        if(e.key==="F12"||
           (e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(k))||
           (e.ctrlKey&&["U","S"].includes(k))){
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      },true);
    })();
  </script>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-bg-glow"></div>
    <div class="scanlines"></div>
    <section class="login-card">
      <div class="terminal-dot-row"><span></span><span></span><span></span></div>
      <p class="eyebrow">NOVA CORE INTERNAL ACCESS</p>
      <h1>NOVA CORE 賽特 II</h1>
      <h2>AI 實戰分析終端</h2>
      <p class="login-desc">請輸入授權碼進入觀察系統</p>
      <div class="password-row">
        <input id="accessCode" type="password" placeholder="輸入授權碼" autocomplete="off" />
        <button id="loginBtn" type="button">授權存取</button>
      </div>
      <p id="loginError" class="login-error"></p>
      <p class="login-note">僅供內部測試與數據觀察使用</p>
    </section>
  </div>

  <main id="appShell" class="app-shell hidden">
    <header class="app-header">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>NOVA CORE</h1>
          <p>SAITER-II SIGNAL TERMINAL</p>
        </div>
      </div>
      <div class="connection"><span class="pulse"></span>終端連線正常</div>
    </header>

    <section id="settingsScreen" class="screen-panel">
      <div class="panel-card settings-card">
        <p class="eyebrow">TERMINAL CONFIGURATION</p>
        <h2>系統參數設定</h2>
        <p class="panel-subtitle">請完成以下資料設定以啟動終端分析</p>
        <form id="settingsForm" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="device">裝置</label>
              <select id="device">
                <option value="">請選擇裝置</option>
                <option value="iOS">iOS</option>
                <option value="Android">Android</option>
                <option value="Windows">Windows</option>
              </select>
              <p id="deviceError" class="field-error"></p>
            </div>
            <div class="field">
              <label for="account">會員帳號</label>
              <input id="account" type="text" placeholder="請輸入會員帳號" maxlength="60" autocomplete="off" />
              <p id="accountError" class="field-error"></p>
            </div>
            <div class="field">
              <label for="amount">設定金額</label>
              <input id="amount" type="text" inputmode="numeric" placeholder="請輸入設定金額" autocomplete="off" />
              <p id="amountError" class="field-error"></p>
            </div>
            <div class="field">
              <label for="game">遊戲選項</label>
              <select id="game"><option value="">請選擇遊戲</option></select>
              <p id="gameError" class="field-error"></p>
            </div>
            <div class="field full">
              <label for="tableNumber">桌號</label>
              <input id="tableNumber" type="text" inputmode="numeric" placeholder="請輸入桌號" autocomplete="off" />
              <p id="tableNumberError" class="field-error"></p>
            </div>
          </div>
          <button id="confirmBtn" class="primary-btn" type="submit">確定</button>
        </form>
      </div>
    </section>

    <section id="processingScreen" class="processing-screen hidden" aria-live="polite">
      <div class="processing-grid"></div>
      <div class="scan-beam"></div>
      <div class="processing-card">
        <div class="status-orbit"><span></span></div>
        <p class="eyebrow">NOVA CORE DATA PROCESSOR</p>
        <h2 id="processingStatus">偵測數據中</h2>
        <p id="processingPercent" class="processing-percent">0%</p>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="terminalLines" class="terminal-lines" aria-hidden="true"></div>
        <dl id="processingSummary" class="processing-summary"></dl>
      </div>
    </section>

    <section id="resultScreen" class="screen-panel hidden">
      <div class="result-wrap">
        <div class="success-heading">
          <span class="success-icon" aria-hidden="true"></span>
          <div><p class="eyebrow">CONFIGURATION COMPLETE</p><h2>設定完成</h2></div>
        </div>
        <div class="panel-card result-card">
          <dl id="resultData" class="result-data"></dl>
        </div>
        <div class="panel-card signal-card">
          <p class="eyebrow gold">FREE SPIN SIGNAL</p>
          <h3>購買免遊訊號</h3>
          <div id="signalResults" class="signal-results"></div>
          <p id="signalImageError" class="image-error" aria-live="polite"></p>
        </div>
        <div class="time-row">
          <p>裝置當前時間：<span id="currentTime">--</span></p>
          <p>系統運行時間：<span id="elapsedTime">0時0分0秒</span></p>
        </div>
        <button id="resetBtn" class="primary-btn reset-btn" type="button">重置</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
